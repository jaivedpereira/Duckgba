<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <defs>
    <clipPath id="phone-g"><rect x="6" y="6" width="708" height="348" rx="34"/></clipPath>
  </defs>
  <rect x="0" y="0" width="720" height="360" rx="40" fill="#1a1a1a"/>
  <rect x="6" y="6" width="708" height="348" rx="34" fill="#000000"/>
  <g clip-path="url(#phone-g)" font-family="Inter, system-ui, sans-serif">
    <!-- LCD area (Game Boy aspect) -->
    <g transform="translate(180,30)">
      <rect width="320" height="288" fill="#9bbc0f"/>
      <!-- Tetris-like blocks -->
      <g fill="#0f380f">
        <rect x="100" y="180" width="20" height="20"/>
        <rect x="120" y="180" width="20" height="20"/>
        <rect x="140" y="180" width="20" height="20"/>
        <rect x="160" y="180" width="20" height="20"/>
        <rect x="120" y="160" width="20" height="20"/>
        <rect x="140" y="160" width="20" height="20"/>
        <rect x="80"  y="200" width="20" height="20"/>
        <rect x="100" y="200" width="20" height="20"/>
        <rect x="120" y="200" width="20" height="20"/>
        <rect x="180" y="200" width="20" height="20"/>
        <rect x="200" y="200" width="20" height="20"/>
        <rect x="220" y="200" width="20" height="20"/>
      </g>
      <text x="160" y="40" fill="#0f380f" text-anchor="middle" font-weight="900" font-size="28">TETRIS</text>
    </g>

    <!-- MENU pill -->
    <rect x="320" y="14" width="80" height="22" rx="10" fill="#1a1a1a" opacity="0.85"/>
    <text x="360" y="30" fill="#FFD400" font-size="11" font-weight="700" text-anchor="middle">MENU</text>

    <!-- D-Pad -->
    <g transform="translate(70,260)" fill="#1a1a1a">
      <rect x="-30" y="-90" width="60" height="180" rx="10"/>
      <rect x="-90" y="-30" width="180" height="60" rx="10"/>
    </g>
    <g transform="translate(70,260)" fill="#FFD400" font-size="14" text-anchor="middle">
      <text y="-66">▲</text>
      <text y="80">▼</text>
      <text x="-66" y="6">◀</text>
      <text x="66" y="6">▶</text>
    </g>

    <!-- A and B buttons -->
    <circle cx="640" cy="220" r="38" fill="#FFD400"/>
    <text x="640" y="232" fill="#000" font-size="30" font-weight="900" text-anchor="middle">A</text>
    <circle cx="560" cy="300" r="38" fill="#FFD400"/>
    <text x="560" y="312" fill="#000" font-size="30" font-weight="900" text-anchor="middle">B</text>

    <!-- Start / Select -->
    <rect x="284" y="320" width="64" height="22" rx="11" fill="#1a1a1a"/>
    <text x="316" y="335" fill="#FFD400" font-size="9" font-weight="700" text-anchor="middle">SELECT</text>
    <rect x="372" y="320" width="64" height="22" rx="11" fill="#1a1a1a"/>
    <text x="404" y="335" fill="#FFD400" font-size="9" font-weight="700" text-anchor="middle">START</text>
  </g>
</svg>
