<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <clipPath id="phone"><rect x="6" y="6" width="348" height="628" rx="34"/></clipPath>
  </defs>

  <!-- Phone body -->
  <rect x="0" y="0" width="360" height="640" rx="40" fill="#1a1a1a"/>
  <rect x="6" y="6" width="348" height="628" rx="34" fill="#000000"/>

  <g clip-path="url(#phone)">
    <!-- Status bar -->
    <text x="22" y="32" fill="#888" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">9:41</text>

    <!-- Title -->
    <text x="24" y="120" fill="#FFD400" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="900">Duckgba</text>
    <text x="24" y="146" fill="#888" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Game Boy Emulator</text>

    <!-- Empty state -->
    <g transform="translate(180,330)" text-anchor="middle">
      <!-- Game pad icon -->
      <g transform="translate(-30,-60)" stroke="#FFD400" stroke-width="2.4" fill="none">
        <rect x="0" y="0" width="60" height="36" rx="10"/>
        <circle cx="14" cy="18" r="3" fill="#FFD400"/>
        <circle cx="46" cy="14" r="2.5" fill="#FFD400"/>
        <circle cx="52" cy="22" r="2.5" fill="#FFD400"/>
        <circle cx="40" cy="22" r="2.5" fill="#FFD400"/>
        <circle cx="46" cy="28" r="2.5" fill="#FFD400"/>
      </g>
      <text y="-4" fill="#ededed" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Sua biblioteca está vazia</text>
      <text y="20" fill="#888" font-family="Inter, system-ui, sans-serif" font-size="11">Toque no botão + para importar uma ROM</text>
    </g>

    <!-- FAB -->
    <circle cx="312" cy="572" r="26" fill="#FFD400"/>
    <text x="312" y="582" fill="#000" font-family="Inter" font-size="34" font-weight="900" text-anchor="middle">+</text>
  </g>
</svg>
