<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <rect width="1200" height="300" fill="#000000"/>

  <!-- Glow under the duck -->
  <ellipse cx="220" cy="200" rx="160" ry="22" fill="#FFD400" opacity="0.08"/>

  <!-- Duck body -->
  <ellipse cx="220" cy="170" rx="90" ry="70" fill="#FFD400"/>
  <!-- Duck head -->
  <circle cx="270" cy="120" r="48" fill="#FFD400"/>
  <!-- Duck beak -->
  <polygon points="316,116 366,124 316,134" fill="#FF8800"/>
  <!-- Duck eye -->
  <circle cx="282" cy="115" r="6" fill="#000"/>
  <circle cx="284" cy="113" r="2" fill="#FFFFFF"/>

  <!-- Duck wing detail (Game Boy d-pad) -->
  <g transform="translate(208,170)">
    <rect x="-6" y="-22" width="12" height="44" fill="#0F380F" rx="2"/>
    <rect x="-22" y="-6" width="44" height="12" fill="#0F380F" rx="2"/>
  </g>

  <!-- Title -->
  <text x="420" y="155" fill="#FFD400" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="900" font-size="120" letter-spacing="-3">Duckgba</text>
  <text x="424" y="200" fill="#888888" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" font-size="22" letter-spacing="2">GAME · BOY · EMULATOR</text>

  <!-- Color palette swatches -->
  <g transform="translate(424,230)">
    <rect x="0"   y="0" width="28" height="28" rx="4" fill="#E6F8DA"/>
    <rect x="36"  y="0" width="28" height="28" rx="4" fill="#99C886"/>
    <rect x="72"  y="0" width="28" height="28" rx="4" fill="#437969"/>
    <rect x="108" y="0" width="28" height="28" rx="4" fill="#051F2A"/>
  </g>
</svg>
